name: MP PHARMAI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  billing-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trix_test
      TEST_PORT: 4317
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax and frontend checks
        run: npm run check
      - name: Run PostgreSQL and billing/MoMo end-to-end tests
        run: npm run test:billing
