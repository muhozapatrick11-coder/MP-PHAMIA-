<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP PHARMAI | User approvals</title><style>body{font:15px system-ui;background:#faf8fd;color:#241b31;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:white;border:1px solid #e8e0f0;border-radius:14px;padding:20px;margin:14px 0}button,select{padding:9px;border-radius:8px;border:1px solid #ddd;margin:4px}button{background:#6d28d9;color:white;border:0;cursor:pointer}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#71677e}</style></head><body><main class="wrap"><h1>MP PHARMAI — User approvals</h1><p class="muted">Only the main owner account can approve staff registrations.</p><div id="list">Loading pending requests…</div><p><a href="/index.html">Back to dashboard</a></p></main><script>
const token=sessionStorage.getItem('trix_access_token');async function api(path,opts={}){const r=await fetch('/api'+path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){if(!token){$('list').textContent='Please log in first.';return}try{const d=await api('/admin/users/pending');$('list').innerHTML=d.users.length?d.users.map(u=>`<article class="card"><div class="row"><div><strong>${esc(u.full_name)}</strong><div>${esc(u.email)} · @${esc(u.username||'')}</div><div class="muted">Requested: ${esc(u.requested_role||'staff')}</div></div><div><select id="role-${u.id}"><option value="pharmacist">Pharmacist</option><option value="cashier">Cashier</option><option value="stock_controller">Stock controller</option><option value="claims">Claims</option><option value="admin">Administrator</option></select><button onclick="approve('${u.id}')">Approve</button><button onclick="reject('${u.id}')">Reject</button></div></div></article>`).join(''):'<p>No pending registrations.</p>'}catch(e){$('list').textContent=e.message}}
function $(id){return document.getElementById(id)}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function approve(id){try{await api('/admin/users/'+id+'/approve',{method:'POST',body:JSON.stringify({role:$('role-'+id).value})});load()}catch(e){alert(e.message)}}async function reject(id){if(!confirm('Reject this registration?'))return;try{await api('/admin/users/'+id+'/reject',{method:'POST',body:'{}'});load()}catch(e){alert(e.message)}}load();
</script></body></html>
