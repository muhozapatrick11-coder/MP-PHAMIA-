<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset MP PHARMAI password</title><style>body{font:15px system-ui;background:#f4f8f8;color:#17313a;margin:0;display:grid;min-height:100vh;place-items:center}.card{background:white;padding:28px;border:1px solid #dfe8e8;border-radius:16px;width:min(430px,calc(100% - 36px))}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:11px;border:1px solid #d4e0e1;border-radius:8px;box-sizing:border-box}button{margin-top:16px;padding:11px 14px;background:#087f78;color:white;border:0;border-radius:8px;font-weight:700}p{color:#5e737a;font-size:13px}</style></head><body><div class="card"><h1>Set a new password</h1><p>Use a strong password of at least 12 characters. The reset link expires after 20 minutes.</p><form id="f"><label>New password</label><input id="pw" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button>Reset password</button></form><p id="msg"></p></div><script>const token=new URLSearchParams(location.search).get('token');document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');if(!token){msg.textContent='The reset token is missing.';return}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:document.getElementById('pw').value})});const d=await r.json();msg.textContent=r.ok?'Password updated. You may return to MP PHARMAI and sign in.':(d.error||'Could not reset password.');}catch{msg.textContent='Connection error. Please try again.'}});</script></body></html>
