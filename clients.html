<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b21b6"><title>Find Medicines | MP PHARMAI</title>
<style>
:root{--teal:#6d28d9;--ink:#24143d;--muted:#70647e;--line:#e8def4;--bg:#f8f5fc;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:#2e1065;color:white;padding:18px max(20px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:20px;font-weight:800}.brand span{color:#9bded6}.top a{color:white;text-decoration:none;border:1px solid #7653a6;border-radius:9px;padding:9px 12px;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:32px 18px 50px}.hero{padding:24px 0 20px}.eyebrow{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:1.5px}.hero h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.3px;line-height:1.1;margin:10px 0}.hero p{max-width:680px;color:var(--muted);margin:0}.search{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;background:white;border:1px solid var(--line);padding:15px;border-radius:15px;box-shadow:0 8px 25px #163b3b0a}.search label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.search input{width:100%;padding:12px;border:1px solid #d4e1e1;border-radius:9px;font:inherit;min-width:0}.search button,.btn{background:var(--teal);color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer;align-self:end}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;min-width:0}.tag{display:inline-block;background:#eee6fb;color:#54219a;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.tag.rx{background:#fff0d5;color:#815300}.card h2{font-size:18px;margin:12px 0 4px}.sub{color:var(--muted);font-size:13px}.branch{border-top:1px solid #edf1f1;margin-top:14px;padding-top:12px}.price{font-size:18px;font-weight:800;margin-top:10px}.notice{background:#fff8e7;border:1px solid #efd99f;border-radius:11px;padding:13px 15px;color:#674c12;font-size:13px;margin:20px 0}.empty,.loading{grid-column:1/-1;text-align:center;background:white;border:1px dashed #cadada;border-radius:13px;padding:35px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px 0 5px}.error{color:#a12626}@media(max-width:760px){.search{grid-template-columns:1fr}.search button{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.meta{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top{padding:15px}.wrap{padding:20px 13px 35px}.hero{padding-top:15px}}
</style></head><body><header class="top"><div class="brand">MP <span>PHARMAI</span></div></header><main class="wrap"><section class="hero"><h1>Search medicine</h1></section>
<form class="search" id="searchForm"><div><input id="medicine" name="search" aria-label="Search medicine" placeholder="Search medicine…" maxlength="100"></div><button type="submit">Search</button></form>
<div class="meta"><strong id="resultCount">Available medicines</strong></div><section id="results" class="grid" aria-live="polite"><div class="empty">Search for a medicine.</div></section>
<footer>MP PHARMAI</footer></main>
<script>
const form=document.getElementById('searchForm'),results=document.getElementById('results'),count=document.getElementById('resultCount');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return Number(v).toLocaleString('en-RW',{maximumFractionDigits:0})+' RWF'}
async function search(){const d=new FormData(form),q=new URLSearchParams({search:String(d.get('search')||'').trim()});results.innerHTML='<div class="loading">Searching…</div>';count.textContent='Loading results';try{const r=await fetch('/api/public/availability?'+q.toString(),{headers:{Accept:'application/json'}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not load availability');const meds=data.medicines||[];count.textContent=meds.length+' medicine'+(meds.length===1?'':'s')+' found';if(!meds.length){results.innerHTML='<div class="empty">No matching in-stock medicines were found. Try a different medicine name or broader area, or contact a pharmacy directly.</div>';return}results.innerHTML=meds.map(m=>`<article class="card"><span class="tag">${esc(m.availability||'In stock')}</span><h2>${esc(m.name)}</h2><div class="sub">${esc(m.generic_name||'Generic name not listed')}${m.strength?' · '+esc(m.strength):''}${m.dosage_form?' · '+esc(m.dosage_form):''}</div><div class="branch"><strong>${esc(m.branch_name)}</strong><div class="sub">${esc(m.branch_address||'Contact branch for address details')}</div><div class="price">${money(m.starting_price)} <span class="sub" style="display:inline">starting price</span></div></div></article>`).join('')}catch(e){count.textContent='Availability unavailable';results.innerHTML='<div class="empty error">We could not connect to the live catalogue. Please try again later or contact the pharmacy.</div>'}}
form.addEventListener('submit',e=>{e.preventDefault();search()});
const initialSearch=new URLSearchParams(location.search).get('search');if(initialSearch)document.getElementById('medicine').value=initialSearch;
// Load available medicines when the client page opens.
search();
</script></body></html>
